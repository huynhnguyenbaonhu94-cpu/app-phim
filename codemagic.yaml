workflows:
  cinemora-ios:
    name: Cinemora Native iOS IPA (SwiftUI)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.serval4238.taurus3258
      vars:
        API_BASE_URL: https://cungcapicloud.id.vn
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi

      - name: Verify latest SwiftUI build fixes
        script: |
          set -euo pipefail
          grep -Fq 'if let preview = imagePreview' mobile-swiftui/Sources/Cinemora/Views/MovieRequestScreen.swift
          grep -Fq 'var episodeGroups: [MovieServer]?' mobile-swiftui/Sources/Cinemora/Models/CinemaModels.swift
          grep -Fq 'Task { @MainActor [weak self] in' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          # Remove these retired sources if an old checkout or ZIP-overwrite left them behind.
          rm -f mobile-swiftui/Sources/Cinemora/State/DownloadManager.swift \
            mobile-swiftui/Sources/Cinemora/State/NativeHLSDownloadSession.swift \
            mobile-swiftui/Sources/Cinemora/State/OfflinePlaybackSupport.swift \
            mobile-swiftui/Sources/Cinemora/Views/DownloadsScreen.swift \
            mobile-swiftui/Sources/Cinemora/Views/DownloadFolderScreen.swift
          grep -Fq 'languageCode(for: preferred)' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'playback.setNativeSubtitles(true)' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'func prepareNativeSubtitlesForPiP() async -> Bool' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'await playback.prepareNativeSubtitlesForPiP()' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'currentMediaSelection.selectedMediaOption(in: group)' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'if subtitleReady {' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'isAdminManuallyAdded: Bool { apiID?.hasPrefix("custom-") == true }' mobile-swiftui/Sources/Cinemora/Models/CinemaModels.swift
          grep -Fq 'currentEpisodeHasManualSidecarSubtitle' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'if pictureInPictureEnabled && currentEpisodeAllowsPiP && pipCoordinator.isSupported' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'pipCoordinator.setAutoStart(pictureInPictureEnabled && currentEpisodeAllowsPiP)' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'requestedNativeTrackID' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'let nativeTracks: [(id: String, language: String, url: URL)]' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'let selectedTrack = preferredTrack ?? effectiveTracks.first' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'let loadTask = Task.detached(priority: .utility) { () -> Data? in' mobile-swiftui/Sources/Cinemora/Design/CinemaComponents.swift
          grep -Fq 'let loaded: Data? = await loadTask.value' mobile-swiftui/Sources/Cinemora/Design/CinemaComponents.swift
          grep -Fq 'sessionMissCount >= 2' mobile-swiftui/Sources/Cinemora/State/CinemaStore.swift
          grep -Fq 'try await api.logoutAllDevices()' mobile-swiftui/Sources/Cinemora/State/CinemaStore.swift
          grep -Fq 'let succeeded = await store.logoutAllDevices()' mobile-swiftui/Sources/Cinemora/Views/AccountSettingsScreen.swift
          grep -Fq 'onSubmitQuery: { query in' mobile-swiftui/Sources/Cinemora/Views/SearchScreen.swift
          grep -Fq 'store.search(query, recordHistory: true)' mobile-swiftui/Sources/Cinemora/Views/SearchScreen.swift
          grep -Fq 'func search(_ keyword: String, recordHistory: Bool = false) async' mobile-swiftui/Sources/Cinemora/State/CinemaStore.swift
          grep -Fq '.frame(maxHeight: 224, alignment: .top)' mobile-swiftui/Sources/Cinemora/Views/SearchScreen.swift
          grep -Fq 'onEditing: { hasQuery in' mobile-swiftui/Sources/Cinemora/Views/SearchScreen.swift
          grep -Fq 'if !isSearchEntryActive,' mobile-swiftui/Sources/Cinemora/Views/SearchScreen.swift
          grep -Fq 'store.searchResults.isEmpty,' mobile-swiftui/Sources/Cinemora/Views/SearchScreen.swift
          if grep -E 'catalogTotal|catalogMovies[.]count.*phim' mobile-swiftui/Sources/Cinemora/Views/LibraryScreen.swift; then
            echo 'ERROR: the Library heading must not display a total movie count'; exit 1
          fi
          grep -Fq 'private var networkBlocked: Bool {' mobile-swiftui/Sources/Cinemora/CinemoraApp.swift
          grep -Fq 'if networkBlocked {' mobile-swiftui/Sources/Cinemora/CinemoraApp.swift
          grep -Fq 'NetworkUnavailableOverlay(isCheckingConnection: !connectivity.hasDeterminedStatus)' mobile-swiftui/Sources/Cinemora/CinemoraApp.swift
          grep -Fq '.allowsHitTesting(!keyboardVisible && !networkBlocked)' mobile-swiftui/Sources/Cinemora/CinemoraApp.swift
          grep -Fq '.accessibilityHidden(networkBlocked)' mobile-swiftui/Sources/Cinemora/CinemoraApp.swift
          grep -Fq 'connectivity.hasDeterminedStatus, connectivity.isConnected' mobile-swiftui/Sources/Cinemora/CinemoraApp.swift
          if grep -R -n -E 'DownloadManager|NativeHLSDownloadSession|OfflinePlaybackSupport|OfflineFileActivityView|DownloadsScreen|DownloadSheet|DownloadFolderSection|DownloadFolderScreen|AVAssetDownloadURLSession|AVAssetDownloadTask|localFileURL|offlineOnly|Mở bằng VLC|Tải xuống|Đã tải xuống|MOVPKG' mobile-swiftui/Sources/Cinemora mobile-swiftui/Info.plist; then
            echo 'ERROR: retired offline movie download code or UI remains in the iOS target'; exit 1
          fi
          if grep -Fq 'if let imagePreview {' mobile-swiftui/Sources/Cinemora/Views/MovieRequestScreen.swift; then
            echo 'ERROR: Codemagic is using the stale MovieRequestScreen.swift'; exit 1
          fi

          # Xcode/SwiftDriver identifies private declarations by filename. Older
          # checkouts may still contain both copies of AccountModels.swift, which
          # makes the archive fail before Swift compilation starts. Keep both
          # implementations available, but give the State copy a unique basename.
          MODELS_ACCOUNT='mobile-swiftui/Sources/Cinemora/Models/AccountModels.swift'
          STATE_ACCOUNT='mobile-swiftui/Sources/Cinemora/State/AccountModels.swift'
          if [ -f "$MODELS_ACCOUNT" ] && [ -f "$STATE_ACCOUNT" ]; then
            mv "$STATE_ACCOUNT" 'mobile-swiftui/Sources/Cinemora/State/AccountModelsState.swift'
            echo 'Renamed duplicate State/AccountModels.swift to AccountModelsState.swift'
          fi

          DUPLICATE_SWIFT_BASENAMES="$(find mobile-swiftui/Sources/Cinemora -type f -name '*.swift' -print \
            | sed 's#^.*/##' | sort | uniq -d)"
          if [ -n "$DUPLICATE_SWIFT_BASENAMES" ]; then
            echo "ERROR: duplicate Swift basenames remain: $DUPLICATE_SWIFT_BASENAMES"
            exit 1
          fi
          echo 'SwiftUI build-fix preflight: OK'

      - name: Generate and validate native SwiftUI Xcode project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile-swiftui"
          xcodegen generate --spec project.yml
          test -d Cinemora.xcodeproj
          xcodebuild -list -project "$CM_BUILD_DIR/mobile-swiftui/Cinemora.xcodeproj"

      - name: Configure iOS signing profiles
        script: |
          xcode-project use-profiles

      - name: Build signed SwiftUI IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/mobile-swiftui/Cinemora.xcodeproj" \
            --scheme Cinemora \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
