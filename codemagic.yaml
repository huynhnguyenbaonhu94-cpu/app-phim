workflows:
  cinemora-ios:
    name: Cinemora Native iOS IPA (SwiftUI)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.serval4238.taurus3258
      vars:
        API_BASE_URL: https://cungcapicloud.id.vn
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi

      - name: Verify latest SwiftUI build fixes
        script: |
          set -euo pipefail
          grep -Fq 'if let preview = imagePreview' mobile-swiftui/Sources/Cinemora/Views/MovieRequestScreen.swift
          grep -Fq 'var episodeGroups: [MovieServer]?' mobile-swiftui/Sources/Cinemora/Models/CinemaModels.swift
          grep -Fq 'Task { @MainActor [weak self] in' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'languageCode(for: preferred)' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'playback.setNativeSubtitles(true)' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'requestedNativeTrackID' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'let nativeTracks: [(id: String, language: String, url: URL)]' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'let selectedTrack = preferredTrack ?? effectiveTracks.first' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          grep -Fq 'let loadTask = Task.detached(priority: .utility) { () -> Data? in' mobile-swiftui/Sources/Cinemora/Design/CinemaComponents.swift
          grep -Fq 'let loaded: Data? = await loadTask.value' mobile-swiftui/Sources/Cinemora/Design/CinemaComponents.swift
          if grep -R -n -E 'DownloadManager|NativeHLSDownloadSession|OfflinePlaybackSupport|OfflineFileActivityView|DownloadsScreen|DownloadSheet|DownloadFolderSection|DownloadFolderScreen|AVAssetDownloadURLSession|AVAssetDownloadTask|localFileURL|offlineOnly|Mở bằng VLC|Tải xuống|Đã tải xuống|MOVPKG' mobile-swiftui/Sources/Cinemora mobile-swiftui/Info.plist; then
            echo 'ERROR: retired offline movie download code or UI remains in the iOS target'; exit 1
          fi
          if grep -Fq 'if let imagePreview {' mobile-swiftui/Sources/Cinemora/Views/MovieRequestScreen.swift; then
            echo 'ERROR: Codemagic is using the stale MovieRequestScreen.swift'; exit 1
          fi

          # Xcode/SwiftDriver identifies private declarations by filename. Older
          # checkouts may still contain both copies of AccountModels.swift, which
          # makes the archive fail before Swift compilation starts. Keep both
          # implementations available, but give the State copy a unique basename.
          MODELS_ACCOUNT='mobile-swiftui/Sources/Cinemora/Models/AccountModels.swift'
          STATE_ACCOUNT='mobile-swiftui/Sources/Cinemora/State/AccountModels.swift'
          if [ -f "$MODELS_ACCOUNT" ] && [ -f "$STATE_ACCOUNT" ]; then
            mv "$STATE_ACCOUNT" 'mobile-swiftui/Sources/Cinemora/State/AccountModelsState.swift'
            echo 'Renamed duplicate State/AccountModels.swift to AccountModelsState.swift'
          fi

          DUPLICATE_SWIFT_BASENAMES="$(find mobile-swiftui/Sources/Cinemora -type f -name '*.swift' -print \
            | sed 's#^.*/##' | sort | uniq -d)"
          if [ -n "$DUPLICATE_SWIFT_BASENAMES" ]; then
            echo "ERROR: duplicate Swift basenames remain: $DUPLICATE_SWIFT_BASENAMES"
            exit 1
          fi
          echo 'SwiftUI build-fix preflight: OK'

      - name: Generate and validate native SwiftUI Xcode project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile-swiftui"
          xcodegen generate --spec project.yml
          test -d Cinemora.xcodeproj
          xcodebuild -list -project "$CM_BUILD_DIR/mobile-swiftui/Cinemora.xcodeproj"

      - name: Configure iOS signing profiles
        script: |
          xcode-project use-profiles

      - name: Build signed SwiftUI IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/mobile-swiftui/Cinemora.xcodeproj" \
            --scheme Cinemora \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
