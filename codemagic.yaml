workflows:
  cinemora-ios-simulator:
    name: Cinemora iOS Simulator Preview (.app)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        API_BASE_URL: https://cungcapicloud.id.vn
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi

      - name: Prepare native SwiftUI project for simulator
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile-swiftui"
          MODELS_ACCOUNT='Sources/Cinemora/Models/AccountModels.swift'
          STATE_ACCOUNT='Sources/Cinemora/State/AccountModels.swift'
          if [ -f "$MODELS_ACCOUNT" ] && [ -f "$STATE_ACCOUNT" ]; then
            mv "$STATE_ACCOUNT" 'Sources/Cinemora/State/AccountModelsState.swift'
          fi
          DUPLICATE_SWIFT_BASENAMES="$(find Sources/Cinemora -type f -name '*.swift' -print | sed 's#^.*/##' | sort | uniq -d)"
          if [ -n "$DUPLICATE_SWIFT_BASENAMES" ]; then
            echo "ERROR: duplicate Swift basenames remain: $DUPLICATE_SWIFT_BASENAMES"
            exit 1
          fi
          xcodegen generate --spec project.yml
          test -d Cinemora.xcodeproj

      - name: Build unsigned iOS Simulator app
        script: |
          set -euo pipefail
          xcodebuild build \
            -project "$CM_BUILD_DIR/mobile-swiftui/Cinemora.xcodeproj" \
            -scheme Cinemora \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Verify simulator app artifact
        script: |
          set -euo pipefail
          APP_PATH="$(find /Users/builder/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Debug-iphonesimulator/Cinemora.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          echo "Simulator preview artifact: $APP_PATH"
    artifacts:
      - /Users/builder/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  cinemora-ios:
    name: Cinemora Native iOS IPA (SwiftUI)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.serval4238.taurus3258
      vars:
        API_BASE_URL: https://cungcapicloud.id.vn
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi

      - name: Verify latest SwiftUI build fixes
        script: |
          set -euo pipefail
          grep -Fq 'if let preview = imagePreview' mobile-swiftui/Sources/Cinemora/Views/MovieRequestScreen.swift
          grep -Fq 'var episodeGroups: [MovieServer]?' mobile-swiftui/Sources/Cinemora/Models/CinemaModels.swift
          grep -Fq 'MainActor.assumeIsolated' mobile-swiftui/Sources/Cinemora/Player/CinemaPlayerScreen.swift
          if grep -Fq 'if let imagePreview {' mobile-swiftui/Sources/Cinemora/Views/MovieRequestScreen.swift; then
            echo 'ERROR: Codemagic is using the stale MovieRequestScreen.swift'; exit 1
          fi

          # Xcode/SwiftDriver identifies private declarations by filename. Older
          # checkouts may still contain both copies of AccountModels.swift, which
          # makes the archive fail before Swift compilation starts. Keep both
          # implementations available, but give the State copy a unique basename.
          MODELS_ACCOUNT='mobile-swiftui/Sources/Cinemora/Models/AccountModels.swift'
          STATE_ACCOUNT='mobile-swiftui/Sources/Cinemora/State/AccountModels.swift'
          if [ -f "$MODELS_ACCOUNT" ] && [ -f "$STATE_ACCOUNT" ]; then
            mv "$STATE_ACCOUNT" 'mobile-swiftui/Sources/Cinemora/State/AccountModelsState.swift'
            echo 'Renamed duplicate State/AccountModels.swift to AccountModelsState.swift'
          fi

          DUPLICATE_SWIFT_BASENAMES="$(find mobile-swiftui/Sources/Cinemora -type f -name '*.swift' -print \
            | sed 's#^.*/##' | sort | uniq -d)"
          if [ -n "$DUPLICATE_SWIFT_BASENAMES" ]; then
            echo "ERROR: duplicate Swift basenames remain: $DUPLICATE_SWIFT_BASENAMES"
            exit 1
          fi
          echo 'SwiftUI build-fix preflight: OK'

      - name: Generate and validate native SwiftUI Xcode project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile-swiftui"
          xcodegen generate --spec project.yml
          test -d Cinemora.xcodeproj
          xcodebuild -list -project "$CM_BUILD_DIR/mobile-swiftui/Cinemora.xcodeproj"

      - name: Configure iOS signing profiles
        script: |
          xcode-project use-profiles

      - name: Build signed SwiftUI IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/mobile-swiftui/Cinemora.xcodeproj" \
            --scheme Cinemora \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  cinemora-expo-ios:
    name: Cinemora Expo iOS IPA (fallback)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      node: 22
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.serval4238.taurus3258
      vars:
        API_BASE_URL: https://cungcapicloud.id.vn
    scripts:
      - name: Install mobile dependencies
        script: |
          cd mobile
          npm ci --legacy-peer-deps

      - name: Generate clean native iOS project
        script: |
          cd mobile
          rm -rf ios
          API_BASE_URL="$API_BASE_URL" npx expo prebuild --platform ios --clean --non-interactive

      - name: Install CocoaPods dependencies
        script: |
          cd mobile/ios
          pod install --repo-update

      - name: Configure iOS signing profiles
        script: |
          xcode-project use-profiles

      - name: Build signed Expo IPA
        script: |
          xcode-project build-ipa \
            --workspace mobile/ios/Cinemora.xcworkspace \
            --scheme Cinemora \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
