workflows:
  cinemora-ios:
    name: Cinemora Native iOS IPA (SwiftUI)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.serval4238.taurus3258
      vars:
        API_BASE_URL: https://cungcapicloud.id.vn
    scripts:
      - name: Install XcodeGen
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi

      - name: Generate and validate native SwiftUI Xcode project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile-swiftui"
          xcodegen generate --spec project.yml
          test -d Cinemora.xcodeproj
          xcodebuild -list -project "$CM_BUILD_DIR/mobile-swiftui/Cinemora.xcodeproj"

      - name: Configure iOS signing profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles

      - name: Build signed SwiftUI IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/mobile-swiftui/Cinemora.xcodeproj" \
            --scheme Cinemora \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  cinemora-expo-ios:
    name: Cinemora Expo Native iOS IPA (fallback)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      node: 22
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.serval4238.taurus3258
      vars:
        API_BASE_URL: https://cungcapicloud.id.vn
    scripts:
      - name: Install mobile dependencies
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          npm ci --legacy-peer-deps

      - name: Generate clean native iOS project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile"
          rm -rf ios
          API_BASE_URL="$API_BASE_URL" npx expo prebuild --platform ios --clean --non-interactive

      - name: Install CocoaPods dependencies
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/mobile/ios"
          pod install --repo-update

      - name: Configure iOS signing profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles

      - name: Build signed Expo IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/mobile/ios/Cinemora.xcworkspace" \
            --scheme Cinemora \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
