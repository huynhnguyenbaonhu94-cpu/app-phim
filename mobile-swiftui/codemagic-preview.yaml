workflows:
  cinemora-ios-simulator:
    name: Cinemora iOS Simulator Preview
    max_build_duration: 45
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: app.serval4238.taurus3258
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen || brew upgrade xcodegen
      - name: Generate Xcode project
        script: |
          cd mobile-swiftui
          xcodegen generate --spec project.yml
      - name: Build unsigned Simulator app
        script: |
          cd mobile-swiftui
          rm -rf build/DerivedData
          xcodebuild build \
            -project Cinemora.xcodeproj \
            -scheme Cinemora \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
    artifacts:
      - mobile-swiftui/build/DerivedData/Build/Products/Debug-iphonesimulator/Cinemora.app
      - /tmp/xcodebuild_logs/*.log
